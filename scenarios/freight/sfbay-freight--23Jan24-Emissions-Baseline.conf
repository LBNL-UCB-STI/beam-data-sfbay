include "../../sfbay-base.conf"

beam.agentsim.simulationName = "sfbay-freight-23Jan24-Base-Emissions"


beam.agentsim.agents.freight {
  enabled = true
  plansFilePath = ${beam.inputDirectory}"/freight/23Jan2024/Base/freight-payloads.csv"
  toursFilePath = ${beam.inputDirectory}"/freight/23Jan2024/Base/freight-tours.csv"
  carriersFilePath = ${beam.inputDirectory}"/freight/23Jan2024/Base/freight-carriers--emissions.csv"
  vehicleTypesFilePath = ${beam.inputDirectory}"/vehicle-tech/freight-vehicletypes--emissions-baseline.csv"
  carrierParkingFilePath = ""
  isWgs = true
  generateFixedActivitiesDurations = true
  tourSampleSizeAsFractionOfTotal = 1.0 # FRISM is providing 10% of total population of tours
}