include "../../sfbay-base.conf"

beam.agentsim.simulationName = "sfbay-freight--12Aug2024-2018-Baseline"


beam.agentsim.agents.freight {
  enabled = true
  plansFilePath = ${beam.inputDirectory}"/freight/2024-08-12/SF_tour_plan_10pct/freight-merged-payloads.csv"
  toursFilePath = ${beam.inputDirectory}"/freight/2024-08-12/SF_tour_plan_10pct/freight-merged-tours.csv"
  carriersFilePath = ${beam.inputDirectory}"/freight/2024-08-12/SF_tour_plan_10pct/freight-merged-carriers.csv"
  vehicleTypesFilePath = ${beam.inputDirectory}"/vehicle-tech/freight-only-vehicletypes--SF_tour_plan_10pct.csv"
  carrierParkingFilePath = ""
  isWgs = true
  generateFixedActivitiesDurations = true
  tourSampleSizeAsFractionOfTotal = 1.0 # FRISM is providing 10% of total population of tours
}