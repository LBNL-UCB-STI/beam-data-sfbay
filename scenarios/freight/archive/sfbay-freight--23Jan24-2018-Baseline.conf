include "../../sfbay-base.conf"

beam.agentsim.simulationName = "sfbay-freight--23Jan24-2018-Baseline"


beam.agentsim.agents.freight {
  enabled = true
  plansFilePath = ${beam.inputDirectory}"/freight/2024-01-23/2018_Baseline/freight-payloads--2018-Baseline.csv"
  toursFilePath = ${beam.inputDirectory}"/freight/2024-01-23/2018_Baseline/freight-tours--2018-Baseline.csv"
  carriersFilePath = ${beam.inputDirectory}"/freight/2024-01-23/2018_Baseline/freight-carriers--2018-Baseline-emissions.csv"
  vehicleTypesFilePath = ${beam.inputDirectory}"/vehicle-tech/freight-vehicletypes--2018-Baseline.csv"
  carrierParkingFilePath = ""
  isWgs = true
  generateFixedActivitiesDurations = true
  tourSampleSizeAsFractionOfTotal = 1.0 # FRISM is providing 10% of total population of tours
}