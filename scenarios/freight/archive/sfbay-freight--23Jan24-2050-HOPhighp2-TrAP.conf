include "../../sfbay-base.conf"

beam.agentsim.simulationName = "sfbay-freight--23Jan24-2050-HOPhighp2-TrAP"


beam.agentsim.agents.freight {
  enabled = true
  plansFilePath = ${beam.inputDirectory}"/freight/2024-01-23/2050_HOPhighp2/payloads--2050-HOPhighp2.csv"
  toursFilePath = ${beam.inputDirectory}"/freight/2024-01-23/2050_HOPhighp2/tours--2050-HOPhighp2.csv"
  carriersFilePath = ${beam.inputDirectory}"/freight/2024-01-23/2050_HOPhighp2/carriers--2050-HOPhighp2-TrAP.csv"
  vehicleTypesFilePath = ${beam.inputDirectory}"/vehicle-tech/ft-vehicletypes--2050-HOPhighp2-TrAP.csv"
  carrierParkingFilePath = ""
  isWgs = true
  generateFixedActivitiesDurations = true
  tourSampleSizeAsFractionOfTotal = 1.0 # FRISM is providing 10% of total population of tours
}
beam.agentsim.agents.vehicles.vehicleTypesFilePath = ${beam.inputDirectory}"/vehicle-tech/pax-vehicletypes--2018-Baseline-TrAP.csv"

beam.exchange.output.emissions {
    # this is the list of emissions to filter out among
    # "CH4", "CO", "CO2", "HC", "NH3", "NOx", "PM", "PM10", "PM2_5", "ROG", "SOx", "TOG"
    emissionsToFilterOut = []
    # this will embed emissions profiles in the following events: PathTraversalEvent, PersonEntersVehicleEvent, LeavingParkingEvent
    events = false
    # this will produce link level skims through emissions-skimmer
    skims = true
}