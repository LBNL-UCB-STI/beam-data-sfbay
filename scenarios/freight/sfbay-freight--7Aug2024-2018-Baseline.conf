include "../../sfbay-base.conf"

beam.agentsim.simulationName = "sfbay-freight--07Aug2024-2018-Baseline"


beam.agentsim.agents.freight {
  enabled = true
  plansFilePath = ${beam.inputDirectory}"/freight/2024-08-07/Baseline/payloads--2018-Baseline.csv"
  toursFilePath = ${beam.inputDirectory}"/freight/2024-08-07/Baseline/tours--2018-Baseline.csv"
  carriersFilePath = ${beam.inputDirectory}"/freight/2024-08-07/Baseline/carriers--2018-Baseline.csv"
  vehicleTypesFilePath = ${beam.inputDirectory}"/vehicle-tech/ft-vehicletypes--07Aug2024-2018-Baseline.csv"
  carrierParkingFilePath = ""
  isWgs = true
  generateFixedActivitiesDurations = true
  tourSampleSizeAsFractionOfTotal = 1.0 # FRISM is providing 10% of total population of tours
}