include "../../sfbay-base.conf"

beam.agentsim.simulationName = "sfbay-freight--20240923--2018-Baseline"


beam.agentsim.agents.freight {
  enabled = true
  plansFilePath = ${beam.inputDirectory}"/freight/20240923/2018_Baseline/payloads--2018-Baseline.csv"
  toursFilePath = ${beam.inputDirectory}"/freight/20240923/2018_Baseline/tours--2018-Baseline.csv"
