include "../../sfbay-pilates-base.conf"

beam.agentsim.simulationName = "sfbay-pilates--20250730--2018-Baseline"
beam.agentsim.agentSampleSizeAsFractionOfPopulation = 0.001
beam.agentsim.lastIteration = 0
beam.agentsim.agents.parking.search.params.enableLinkBasedSearch = true
beam.agentsim.agents.parking.search.params.freight.minSearchRadius = 10.0
beam.agentsim.agents.parking.search.params.freight.maxSearchRadius = 500.0
beam.agentsim.agents.parking.search.params.searchSampleSize = 5000
beam.agentsim.agents.parking.multinomialLogit.params.parkingTypePreferenceMultiplier = 2.0

beam.agentsim.agents.freight {
  enabled = true
  plansFilePath = ${beam.inputDirectory}"/freight/20250730/2018-Baseline/payloads--2018-Baseline.csv"
  toursFilePath = ${beam.inputDirectory}"/freight/20250730/2018-Baseline/tours--2018-Baseline.csv"
  carriersFilePath = ${beam.inputDirectory}"/freight/20250730/2018-Baseline/carriers--2018-Baseline.csv"
  vehicleTypesFilePath = ${beam.inputDirectory}"/vehicle-tech/vehicleTypes--frism--2018-Baseline.csv"
  carrierParkingFilePath = ${beam.inputDirectory}"/parking/sfbay_taz_unlimited_commercial.csv"
  isWgs = true
  generateFixedActivitiesDurations = true
  tourSampleSizeAsFractionOfTotal = 1.0 # FRISM is providing 10% of total population of tours
}

beam.warmStart.type = "disabled"

beam.physsim.flowCapacityFactor = 0.105
beam.physsim.storageCapacityFactor = 1.0
beam.physsim.name = "JDEQSim"
beam.physsim.inputNetworkFilePath = ${beam.inputDirectory}"/r5/sfbay-area-cbg5500-network/physsim-network.xml"

beam.routing.r5.travelTimeNoiseFraction = 0.05
beam.routing.r5.directory = ${beam.inputDirectory}"/r5/sfbay-area-cbg5500-network"
beam.routing.r5.osmMapdbFile = ${beam.inputDirectory}"/r5/sfbay-area-cbg5500-network/osm.mapdb"
beam.routing.writeRoutingStatistic = false

beam.agentsim.snapLocationAndRemoveInvalidInputs.params {
    enabled = true
    minRadiusInMeter = 100.0
    maxRadiusInMeter = 500000.0
}