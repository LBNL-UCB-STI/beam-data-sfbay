include "network-calibration/beam-pilates-run--sfbay--jdeq-calibration.conf"

beam.agentsim.simulationName = "beam-pilates-run--sfbay--jdeq-calibration-FC07-0"

beam.inputDirectory = ${PWD}"/input/sfbay"

beam.agentsim.lastIteration = 0
beam.physsim.flowCapacityFactor = 0.07
beam.physsim.relaxation.type = "experiment_2.1"
beam.physsim.relaxation.experiment2_1.internalNumberOfIterations = 10
beam.physsim.relaxation.experiment2_1.fractionOfPopulationToReroute = 0.1
beam.physsim.relaxation.experiment2_1.clearRoutesEveryIteration = true
beam.physsim.relaxation.experiment2_1.clearModesEveryIteration = false
beam.agentsim.agents.vehicles.emissions.skims = false

beam.agentsim.agents.vehicles.vehiclesFilePath = ${beam.inputDirectory}"/urbansim/vehicles.parquet"

beam.warmStart.type = "linkStatsOnly"
beam.warmStart.initialLinkstatsFilePath = ${beam.inputDirectory}"/r5/sfbay-cbg5500-weakConn-network/init.linkstats.parquet"

beam.physsim.jdeqsim.shortLink.storageCapacityOverride {
    minimumLinkLengthThreshold = 0.0  # Minimum length threshold (greater than 0) to activate lane override.
    overriddenNumLanesPerLink = 10.0  # Number of lanes to use when overriding the default configuration for short links.
}
