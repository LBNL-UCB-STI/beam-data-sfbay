include "../../sfbay-pilates-base.conf"

beam.agentsim.simulationName = "sfbay-pilates-base--residential-2855pop-network-jdeq"
beam.agentsim.lastIteration = 12
beam.agentsim.agentSampleSizeAsFractionOfPopulation = 1.0
beam.agentsim.agents.freight.enabled = false

beam.physsim.name = "JDEQSim"
beam.physsim.flowCapacityFactor = 1.0
beam.physsim.storageCapacityFactor = 1.0
beam.physsim.skipPhysSim = true
beam.physsim.inputNetworkFilePath = ${beam.inputDirectory}"/r5/sfbay_residential_2855pop_network/physsim-network.xml"
#beam.physsim.overwriteLinkParamPath = ${beam.inputDirectory}"/r5/sfbay_residential_2855pop_network/updatedLinkParams.csv"

beam.warmStart.type = "linkStatsFromLastRun"
beam.warmStart.initialLinkstatsFilePath = ""
beam.warmStart.prepareData = true


beam.routing.r5.directory = ${beam.inputDirectory}"/r5/sfbay_residential_2855pop_network"
beam.routing.r5.osmMapdbFile = ${beam.inputDirectory}"/r5/sfbay_residential_2855pop_network/osm.mapdb"
beam.routing.r5.directory2 = ${beam.inputDirectory}"/r5/sfbay_residential_2855pop_network"

beam.router.skim.activity-sim-skimmer.fileOutputFormat = "omx"





