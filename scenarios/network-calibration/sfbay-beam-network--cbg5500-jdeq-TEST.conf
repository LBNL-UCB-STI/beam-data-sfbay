include "../../sfbay-base.conf"

beam.agentsim.simulationName = "sfbay-beam-network--cbg5500-jdeq"
beam.agentsim.agentSampleSizeAsFractionOfPopulation = 0.1
beam.agentsim.lastIteration = 3
beam.agentsim.agents.freight.enabled = false

beam.warmStart.type = "disabled"
beam.warmStart.prepareData = true
beam.warmStart.initialLinkstatsFilePath = ""

beam.physsim.flowCapacityFactor = 0.12
#beam.physsim.storageCapacityFactor = 0.5
beam.physsim.storageCapacityFactor = 1.0
beam.physsim.name = "JDEQSim"
beam.physsim.inputNetworkFilePath = ${beam.inputDirectory}"/r5/sfbay-area-cbg5500-network/physsim-network.xml"
#beam.physsim.overwriteLinkParamPath = ${beam.inputDirectory}"/r5/sfbay-area-cbg5500-network/updatedLinkParams.csv"
beam.physsim.relaxation.type = "experiment_2.1"
beam.physsim.relaxation.experiment2_0.internalNumberOfIterations = 3
beam.physsim.relaxation.experiment2_1.fractionOfPopulationToReroute = 0.1
beam.physsim.relaxation.experiment2_0.clearRoutesEveryIteration = true
beam.physsim.relaxation.experiment2_0.clearModesEveryIteration = false

beam.routing.r5.travelTimeNoiseFraction = 0.1
beam.routing.r5.directory = ${beam.inputDirectory}"/r5/sfbay-area-cbg5500-network"
beam.routing.r5.osmMapdbFile = ${beam.inputDirectory}"/r5/sfbay-area-cbg5500-network/osm.mapdb"
# beam.routing.r5.directory2 = ${beam.inputDirectory}"/r5/sfbay-area-cbg5500-network-no-buses"

beam.routing.writeRoutingStatistic = false


beam.physsim.network.overwriteRoadTypeProperties.enabled = true
#Freeway
beam.physsim.network.overwriteRoadTypeProperties.motorway.speed = 31.2928
#Freeway-to-Freeway Connector
beam.physsim.network.overwriteRoadTypeProperties.motorwayLink.speed = 26.83
#Expressway
beam.physsim.network.overwriteRoadTypeProperties.trunk.speed = 25.8224
#Ramp
beam.physsim.network.overwriteRoadTypeProperties.trunkLink.speed = 20.352
#Super Arterial
beam.physsim.network.overwriteRoadTypeProperties.primary.speed = 14.88
#Ramp
beam.physsim.network.overwriteRoadTypeProperties.primaryLink.speed = 13.3816

#Collector
beam.physsim.network.overwriteRoadTypeProperties.unclassified.speed = 14.0
beam.physsim.network.overwriteRoadTypeProperties.unclassified.capacity = 1200
#Major Arterial
beam.physsim.network.overwriteRoadTypeProperties.secondary.speed = 10.5
beam.physsim.network.overwriteRoadTypeProperties.secondaryLink.capacity = 2400
#Ramp
beam.physsim.network.overwriteRoadTypeProperties.secondaryLink.speed = 9.5
beam.physsim.network.overwriteRoadTypeProperties.secondaryLink.capacity = 2000
#Minor Arterial
beam.physsim.network.overwriteRoadTypeProperties.tertiary.speed = 9.5
#Ramp
beam.physsim.network.overwriteRoadTypeProperties.tertiaryLink.speed = 8.94
beam.physsim.network.overwriteRoadTypeProperties.tertiaryLink.capacity = 2400
#Local Street
beam.physsim.network.overwriteRoadTypeProperties.residential.speed = 8.94
beam.physsim.network.overwriteRoadTypeProperties.residential.capacity = 1200



beam.agentsim.agents.vehicles.vehiclesFilePath = "urbansim/atlas--2018-Baseline/vehicles.csv.gz"
beam.agentsim.agents.vehicles.vehicleTypesFilePath = ${beam.inputDirectory}"/vehicle-tech/vehicleTypes--atlas--2018-Baseline.csv"
beam.agentsim.agents.vehicles.dummySharedCar.vehicleTypeId = "2022_Honda_Odysseyc6"
beam.exchange.scenario {# source for now can be "Beam" or "UrbanSim"
    source = "urbansim_v2"
    # Input file format for scenario loader can be "xml", "csv" or "parquet"
    fileFormat = "csv"
    folder = ${beam.inputDirectory}"/urbansim/atlas--2018-Baseline"
    # Allows to match urbansim modes to beam modes

    modeMap = [
      "BIKE           -> bike",
      "DRIVEALONEFREE -> car",
      "DRIVEALONEPAY  -> car",
      "DRIVE_COM      -> drive_transit",
      "DRIVE_EXP      -> drive_transit",
      "DRIVE_HVY      -> drive_transit",
      "DRIVE_LOC      -> drive_transit",
      "DRIVE_LRF      -> drive_transit",
      "SHARED2FREE    -> hov2",
      "SHARED2PAY     -> hov2",
      "SHARED3FREE    -> hov3",
      "SHARED3PAY     -> hov3",
      "TAXI           -> ride_hail",
      "TNC_SHARED     -> ride_hail_pooled",
      "TNC_SINGLE     -> ride_hail",
      "WALK           -> walk",
      "WALK_COM       -> walk_transit",
      "WALK_EXP       -> walk_transit",
      "WALK_HVY       -> walk_transit",
      "WALK_LOC       -> walk_transit",
      "WALK_LRF       -> walk_transit",
    ]
    convertWgs2Utm = true
    urbansim.activitySimEnabled = false
    urbansim.scenarioLoadingTimeoutSeconds = 3000
}


