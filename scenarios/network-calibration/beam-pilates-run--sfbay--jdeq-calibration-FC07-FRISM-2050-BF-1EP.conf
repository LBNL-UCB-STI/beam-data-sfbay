include "beam-pilates-run--sfbay--jdeq-calibration.conf"

beam.agentsim.simulationName = "beam-pilates-run--sfbay--jdeq-calibration-FC07-FRISM-2050-BF-1EP"

beam.inputDirectory = ${PWD}"/input/sfbay"

beam.agentsim.lastIteration = 4
beam.physsim.flowCapacityFactor = 0.07
beam.physsim.relaxation.type = "experiment_2.1"
beam.physsim.relaxation.experiment2_1.internalNumberOfIterations = 10
beam.physsim.relaxation.experiment2_1.fractionOfPopulationToReroute = 0.1
beam.physsim.relaxation.experiment2_1.clearRoutesEveryIteration = true
beam.physsim.relaxation.experiment2_1.clearModesEveryIteration = false
beam.routing.r5.travelTimeNoiseFraction = 0.1

beam.agentsim.agents.freight {
  plansFilePath = ${beam.inputDirectory}"/freight/20260925/SFBAY-2050-BF-1EP/payloads--SFBAY-2050-BF-1EP.parquet"
  toursFilePath = ${beam.inputDirectory}"/freight/20260925/SFBAY-2050-BF-1EP/tours--SFBAY-2050-BF-1EP.parquet"
  carriersFilePath = ${beam.inputDirectory}"/freight/20260925/SFBAY-2050-BF-1EP/carriers--SFBAY-2050-BF-1EP.parquet"
  vehicleTypesFilePath = ${beam.inputDirectory}"/vehicle-tech/vehicletypes--frism--SFBAY-2050-BF-1EP.csv"
}

beam.warmStart.type = "linkStatsOnly"
beam.warmStart.initialLinkstatsFilePath = ${beam.inputDirectory}"/r5/sfbay-cbg5500-weakConn-network/2018-baseline-linkstats/3.linkstats.jdeq-calibration-FC07-0--20260825-183615-it3.csv.gz"

beam.physsim.jdeqsim.shortLink.storageCapacityOverride {
    minimumLinkLengthThreshold = 0.0  # Minimum length threshold (greater than 0) to activate lane override.
    overriddenNumLanesPerLink = 10.0  # Number of lanes to use when overriding the default configuration for short links.
}


# FC07 emissions output
beam.router.skim.emissions-skimmer.fileOutputFormat = "parquet"
beam.agentsim.agents.vehicles.emissions.skims = true
beam.agentsim.agents.vehicles.emissions.countyLookup.filePath = ${beam.inputDirectory}"/shape/sfbay_county_2018_wgs84.geojson"
beam.agentsim.agents.vehicles.emissions.countyLookup.countyFieldName = "NAME"

# Keep this key present so PILATES can override the run-specific output path
beam.outputs.baseOutputDirectory = ${PWD}"/output/sfbay"
