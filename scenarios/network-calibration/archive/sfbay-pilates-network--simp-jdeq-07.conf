include "../../sfbay-pilates-base-omx.conf"

beam.agentsim.simulationName = "sfbay-simp-jdeq-0.07"
beam.agentsim.lastIteration = 10
beam.physsim.inputNetworkFilePath = ${beam.inputDirectory}"/r5/sfbay-cbg5500-weakConn-network/physsim-network.xml"

beam.routing {
  #Base local date in ISO 8061 YYYY-MM-DDTHH:MM:SS+HH:MM
  transitOnStreetNetwork = true
  baseDate = "2017-09-22T00:00:00-07:00"
  r5 {
    directory = ${beam.inputDirectory}"/r5/sfbay-cbg5500-weakConn-network"
    # Departure window in min
    departureWindow = 1.0167
    osmFile = ${beam.inputDirectory}"/r5/sfbay-cbg5500-weakConn-network/sfbay-cbg5500-weakConn-network.osm.pbf"
    osmMapdbFile = ${beam.inputDirectory}"/r5/sfbay-cbg5500-weakConn-network/osm.mapdb"
    mNetBuilder.fromCRS = "epsg:4326" # WGS84
    mNetBuilder.toCRS = ${beam.spatial.localCRS}
    directory2 = ${beam.inputDirectory}"/r5/sfbay-cbg5500-weakConn-network-no-buses"
    transitAlternativeList = "NONOPTIMAL"
    suboptimalMinutes = 20
  }
}
# beam.warmStart.initialLinkstatsFilePath = ${beam.inputDirectory}"/r5/sfbay-cbg5500-weakConn-network/init.linkstats.csv.gz"

beam.physsim.flowCapacityFactor = 0.07
beam.physsim.name = "JDEQSim"
beam.physsim.overwriteLinkParamPath = ${beam.inputDirectory}"/r5/sfbay-cbg5500-weakConn-network/updatedLinkParams.csv"


; beam.warmStart.type = "none"
; beam.warmStart.initialLinkstatsFilePath = ""
