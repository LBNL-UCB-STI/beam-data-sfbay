include "../../sfbay-base.conf"

beam.agentsim.simulationName = "sfbay-beam-network--cbg5500-jdeq"
beam.agentsim.agentSampleSizeAsFractionOfPopulation = 0.1
beam.agentsim.lastIteration = 3
beam.agentsim.agents.freight.enabled = false

beam.warmStart.type = "disabled"
beam.warmStart.prepareData = true
beam.warmStart.initialLinkstatsFilePath = ""

beam.physsim.flowCapacityFactor = 0.12
#beam.physsim.storageCapacityFactor = 0.5
beam.physsim.storageCapacityFactor = 1.0
beam.physsim.name = "JDEQSim"
beam.physsim.inputNetworkFilePath = ${beam.inputDirectory}"/r5/sfbay-area-cbg5500-network/physsim-network.xml"
#beam.physsim.overwriteLinkParamPath = ${beam.inputDirectory}"/r5/sfbay-area-cbg5500-network/updatedLinkParams.csv"
beam.physsim.relaxation.type = "experiment_2.1"
beam.physsim.relaxation.experiment2_0.internalNumberOfIterations = 4
beam.physsim.relaxation.experiment2_1.fractionOfPopulationToReroute = 0.1
beam.physsim.relaxation.experiment2_0.clearRoutesEveryIteration = true
beam.physsim.relaxation.experiment2_0.clearModesEveryIteration = false

beam.routing.r5.travelTimeNoiseFraction = 0.1
beam.routing.r5.directory = ${beam.inputDirectory}"/r5/sfbay-area-cbg5500-network"
beam.routing.r5.osmMapdbFile = ${beam.inputDirectory}"/r5/sfbay-area-cbg5500-network/osm.mapdb"
# beam.routing.r5.directory2 = ${beam.inputDirectory}"/r5/sfbay-area-cbg5500-network-no-buses"

beam.routing.writeRoutingStatistic = false
