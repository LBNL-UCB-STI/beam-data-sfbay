fleet_assignment:
  models:

    freight_bayesian_dag:
      scoring:
        likelihood_floor: 0.001
        weights:
          fleet_vmt_prior: 0.2
          fleet_population_prior: 0.05
          payload_mass: 0.1
          naics_sector: 1
          port_location: 5
      evidence:
        payload_mass:
          source: gvwr_lbs
          unit: lbs
          overload_penalty_power: 2.0
        naics_sector:
          - naics_code_2: [ '11', '31', '32', '33', '48', '49' ]
            vehicle_category: [ T6 CAIRP Class 7, T6 Instate Tractor Class 7, T7 CAIRP Class 8, T7 Tractor Class 8, T7IS ]
          - naics_code_2: [ '21' ]
            vehicle_category: [ T6 Instate Delivery Class 7, T6 Instate Other Class 7, T6 OOS Class 7, T7 NNOOS Class 8, T7 NOOS Class 8, T7 Single Dump Class 8, T7 Single Other Class 8 ]
          - naics_code_2: [ '23' ]
            vehicle_category: [ T7 Single Concrete/Transit Mix Class 8, T7 Single Dump Class 8 ]
          - naics_code_2: [ '42', '62', '72' ]
            vehicle_category: [ T6 CAIRP Class 4, T6 CAIRP Class 5, T6 CAIRP Class 6, T6 OOS Class 4, T6 OOS Class 5, T6 OOS Class 6, T6 Instate Other Class 4, T6 Instate Other Class 5, T6 Instate Other Class 6, T6 Instate Delivery Class 7, T6 Instate Other Class 7, T6 OOS Class 7, T7 NNOOS Class 8, T7 NOOS Class 8, T7 Single Dump Class 8, T7 Single Other Class 8 ]
          - naics_code_2: [ '56' ]
            vehicle_category: [ T7 SWCV Class 8, T7 Single Dump Class 8 ]
        port_location:
          - zone_codes: [ '060230013001', '060530126001', '060759809001', '060770039001', '060133780002', '060133180002', '060816103021', '060133580005', '060770039001', '060133580005', '060133200011' ]
            vehicle_category: [ T7 Other Port Class 8 ]
          - zone_codes: [ '060019819001' ]
            vehicle_category: [ T7 POAK Class 8 ]

    passenger_bayesian_dag:
      scoring:
        likelihood_floor: 0.001
        weights:
          fleet_vmt_prior: 0.3
          fleet_population_prior: 0.1
          income: 0.6
      evidence:
        income:
          center_ratio: 0.25
          sigma_ratio: 0.1

  mappings:
    freight:
      vehicle_categories:
        Class12aVocational: [ LDA, LDT1, LDT2 ]
        Class2b3Vocational: [ MDV, LHD1, LHD2 ]
        Class456Vocational: [ T6 CAIRP Class 4, T6 CAIRP Class 5, T6 CAIRP Class 6, T6 Instate Delivery Class 4, T6 Instate Delivery Class 5, T6 Instate Delivery Class 6, T6 Instate Other Class 4, T6 Instate Other Class 5, T6 Instate Other Class 6, T6 Instate Tractor Class 6, T6 OOS Class 4, T6 OOS Class 5, T6 OOS Class 6, T6TS ]
