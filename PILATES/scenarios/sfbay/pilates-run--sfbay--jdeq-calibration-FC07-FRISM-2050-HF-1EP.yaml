# =============================================================================
# RUN CONFIGURATION
# Core run parameters and model selection
# =============================================================================
run:
  region: sfbay
  scenario: base
  start_year: 2017
  end_year: 2018
  land_use_freq: 1
  travel_model_freq: 1
  vehicle_ownership_freq: 6
  supply_demand_iters: 1
  output_directory: /global/scratch/users/$USER/pilates-output
  output_run_name: jdeq-calibration-FC07-FRISM-2050-HF-1EP
  consist_db_local_run: true
  consist_db_filename: provenance.duckdb
  models:
    land_use: null
    travel: beam
    activity_demand: null
    vehicle_ownership: null

